# Staging override for the temporary CX23 (2 vCPU, 4 GB) and for the restore drill.
# On the server, set in /opt/technest/.env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.staging.yml
#   PHOTO_MODEL=isnet-general-use   (BiRefNet does not fit here)
services:
  server:
    deploy: { resources: { limits: { cpus: "1", memory: 1g } } }
  worker:
    deploy: { resources: { limits: { cpus: "1", memory: 768m } } }
  storefront:
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
  postgres:
    deploy: { resources: { limits: { memory: 512m } } }
  redis:
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    deploy: { resources: { limits: { memory: 192m } } }
  photo-worker:
    deploy: { resources: { limits: { cpus: "1", memory: 2560m } } }
