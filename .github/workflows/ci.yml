# CI: install, licence guard, lint, typecheck, tests (Postgres + Redis + Mailpit services), build.
# Runs on every push and pull request. Nothing here deploys or pushes images (see deploy.yml).
# The Deploy workflow refuses a commit whose run of this workflow is not green.
# Third-party actions are pinned to a commit, not a tag.
name: CI

on:
  push:
    branches: [main, "e*/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  MEDUSA_DISABLE_TELEMETRY: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  licence-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No non-commercial background-removal models
        run: bash scripts/check-no-bria.sh
      - name: Guard script tests
        run: bash scripts/check-no-bria.test.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      # Test-only values; the integration runner creates and drops its own databases.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci
      COOKIE_SECRET: ci
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_API_URL: http://localhost:8025/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (emails)
        run: pnpm --filter "./packages/**" build
      - name: Lint
        run: pnpm --filter @technest/backend lint
      - name: Unit tests
        run: pnpm --filter @technest/backend test:unit
      - name: Module integration tests
        run: pnpm --filter @technest/backend test:integration:modules --passWithNoTests
      - name: HTTP integration tests
        run: pnpm --filter @technest/backend test:integration:http:split
      - name: Build (typecheck + admin bundle)
        run: pnpm --filter @technest/backend build

  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only; the real values are build args in deploy.yml.
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_REGION: gb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @technest/storefront lint
      - name: Typecheck
        run: pnpm --filter @technest/storefront typecheck
      - name: Unit tests
        run: pnpm --filter @technest/storefront test
      - name: Build
        run: pnpm --filter @technest/storefront build

  emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @technest/emails test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: docker compose config (dummy values)
        env:
          POSTGRES_PASSWORD: x
          JWT_SECRET: x
          COOKIE_SECRET: x
          S3_FILE_URL: x
          S3_ACCESS_KEY_ID: x
          S3_SECRET_ACCESS_KEY: x
          S3_BUCKET: x
          S3_ENDPOINT: x
          GHCR_OWNER: ci
        run: docker compose --profile ops --profile backup config --quiet
      - name: Deploy script (pull, migrate, tag, start) against a stand-in docker
        run: bash infra/deploy/test-deploy.sh
      - name: Backup and restore scripts
        run: bash infra/backup/test-backup.sh
      - name: Caddyfile validates
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SHOP_DOMAIN=technest.co.uk -e ACME_EMAIL=ci@example.com \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # The three production images build (nothing is pushed). Without this the first real
  # build would be the first deploy.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: technest-backend
            file: apps/backend/Dockerfile
            context: .
          - name: technest-storefront
            file: apps/storefront/Dockerfile
            context: .
          - name: technest-backup
            file: infra/backup/Dockerfile
            context: infra/backup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
            NEXT_PUBLIC_BASE_URL=http://localhost:8000
            NEXT_PUBLIC_DEFAULT_REGION=gb
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci_placeholder
