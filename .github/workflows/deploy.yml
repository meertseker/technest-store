# Deploy: build images -> push to GHCR -> SSH to the server -> pull, migrate, up -d -> health check.
#
# DISABLED until the lead approves: it only runs by hand (workflow_dispatch) AND only when the
# repository variable DEPLOY_ENABLED is "true". Nothing is built on the server.
# Needs (GitHub -> Settings, see DEPLOY.md "GitHub secrets"):
#   environments "staging" and "production" (production with a required reviewer)
#   secrets per environment: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS,
#     NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY, NEXT_PUBLIC_STRIPE_KEY, NEXT_PUBLIC_SENTRY_DSN
#   variables per environment: SHOP_DOMAIN (technest.co.uk or staging.technest.co.uk),
#     NEXT_PUBLIC_IMAGE_HOSTNAME
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: technest-backend
            file: apps/backend/Dockerfile
            context: .
          - name: technest-storefront
            file: apps/storefront/Dockerfile
            context: .
          - name: technest-photo-worker
            file: infra/photo-worker/Dockerfile
            context: infra/photo-worker
    steps:
      - uses: actions/checkout@v4
      - name: Licence guard
        run: bash scripts/licence-guard.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case owner for GHCR
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Staging and production get separate storefront images (NEXT_PUBLIC_* is inlined).
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ inputs.environment }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ inputs.environment }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ inputs.environment }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.${{ vars.SHOP_DOMAIN }}
            NEXT_PUBLIC_BASE_URL=https://${{ vars.SHOP_DOMAIN }}
            NEXT_PUBLIC_DEFAULT_REGION=gb
            NEXT_PUBLIC_IMAGE_HOSTNAME=${{ vars.NEXT_PUBLIC_IMAGE_HOSTNAME }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_STRIPE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      # The photo-worker Dockerfile itself fails the build if any model other than
      # birefnet-general and isnet-general-use ends up in the image, so a bad image is never pushed.

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            Caddyfile
          sparse-checkout-cone-mode: false
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy compose files
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: scp -q docker-compose.yml Caddyfile "$TARGET:/opt/technest/"
      - name: Pull, migrate, start
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          TAG: ${{ inputs.environment }}-${{ github.sha }}
        # $TAG expands here on the runner; \$-escaped values expand on the server.
        run: |
          # shellcheck disable=SC2087
          ssh "$TARGET" "cd /opt/technest && bash -se" <<EOF
          set -euo pipefail
          previous=\$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2 || true)
          echo "\$previous" > .previous_tag
          sed -i '/^IMAGE_TAG=/d' .env && echo "IMAGE_TAG=$TAG" >> .env
          docker compose pull --quiet
          docker compose --profile ops run --rm migrate
          docker compose up -d --remove-orphans
          EOF
      - name: Health check (rolls back to the previous tag on failure)
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DOMAIN: ${{ vars.SHOP_DOMAIN }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://api.$DOMAIN/health" >/dev/null && curl -fsS "https://$DOMAIN/api/health" >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "Unhealthy after 5 minutes: rolling back" >&2
          ssh "$TARGET" "cd /opt/technest && prev=\$(cat .previous_tag) && test -n \"\$prev\" && sed -i '/^IMAGE_TAG=/d' .env && echo IMAGE_TAG=\$prev >> .env && docker compose up -d --remove-orphans"
          exit 1
