# Deploy: build images -> push to GHCR -> ask the server (SSH) to pull, migrate, up -d -> health check.
#
# DISABLED until the lead approves: it only runs by hand (workflow_dispatch) AND only when the
# repository variable DEPLOY_ENABLED is "true". Nothing is built on the server.
# Only `main` can be deployed, and only a commit whose CI run is green.
# Needs (GitHub -> Settings, see DEPLOY.md "GitHub secrets"):
#   environments "staging" and "production" (production with a required reviewer)
#   secrets per environment: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (a key that
#     infra/deploy/setup-deploy-key.sh has restricted to the deploy gate on that server),
#     SSH_KNOWN_HOSTS,
#     NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY, NEXT_PUBLIC_STRIPE_KEY, NEXT_PUBLIC_SENTRY_DSN
#   variables per environment: SHOP_DOMAIN (technest.co.uk or staging.technest.co.uk),
#     NEXT_PUBLIC_IMAGE_HOSTNAME, NEXT_PUBLIC_TURNSTILE_SITE_KEY (public site key)
# Third-party actions are pinned to a commit: a moved tag must not be able to change what
# runs here with the production secrets.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging
      first_deploy:
        description: "First deploy of this environment: build the storefront with a placeholder publishable key"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  # Unique per run: re-deploying the same commit must not overwrite the image the
  # rollback would go back to.
  TAG: ${{ inputs.environment }}-${{ github.sha }}-${{ github.run_number }}

jobs:
  gate:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Only main is deployed
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploys run from main only (this is ${{ github.ref }})." >&2
          exit 1
      - name: CI must be green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
            --commit "${{ github.sha }}" --json conclusion --jq '.[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "CI for ${{ github.sha }} is '$conclusion', not 'success'. Not deploying." >&2
            exit 1
          fi

  images:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: technest-backend
            file: apps/backend/Dockerfile
            context: .
          - name: technest-storefront
            file: apps/storefront/Dockerfile
            context: .
          - name: technest-backup
            file: infra/backup/Dockerfile
            context: infra/backup
          # docker-compose.yml, Caddyfile and deploy.sh for this release (see infra/deploy/Dockerfile).
          - name: technest-deploy
            file: infra/deploy/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Licence guard
        run: bash scripts/check-no-bria.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case owner for GHCR
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Staging and production get separate storefront images (NEXT_PUBLIC_* is inlined).
          # The publishable key only exists once the backend is up, and the storefront build
          # refuses an empty one: a run with "first_deploy" ticked builds with a placeholder,
          # the next one with the real key (DEPLOY.md section 6). Without the tick a missing
          # secret fails the build, so a shop never goes live on the placeholder by mistake.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ inputs.environment }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ inputs.environment }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.${{ vars.SHOP_DOMAIN }}
            NEXT_PUBLIC_BASE_URL=https://${{ vars.SHOP_DOMAIN }}
            NEXT_PUBLIC_DEFAULT_REGION=gb
            NEXT_PUBLIC_IMAGE_HOSTNAME=${{ vars.NEXT_PUBLIC_IMAGE_HOSTNAME }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY || (inputs.first_deploy && 'pk_first_deploy_placeholder') || '' }}
            NEXT_PUBLIC_STRIPE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    # The deploy key can only talk to infra/deploy/deploy-gate.sh on the server (it is listed
    # in authorized_keys with a forced command, see infra/deploy/setup-deploy-key.sh). The gate
    # accepts "deploy <tag>", "rollback", "prune" and "status"; nothing sent from here is run
    # as a command, and no file is copied: the server takes docker-compose.yml, the Caddyfile
    # and deploy.sh out of the technest-deploy image built above.
    steps:
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host *"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
      - name: Pull, migrate, start
        # The new tag is written to .env only after the migration has succeeded
        # (infra/deploy/deploy.sh). If the stack does not start, the gate goes back to the
        # tag and config files that were running.
        run: |
          # shellcheck disable=SC2029 # the tag is expanded here on purpose; the gate validates it
          ssh "$TARGET" "deploy $TAG"
      - name: Health check (rolls back to the previous tag on failure)
        env:
          DOMAIN: ${{ vars.SHOP_DOMAIN }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://api.$DOMAIN/health" >/dev/null && curl -fsS "https://$DOMAIN/api/health" >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "Unhealthy after 5 minutes: rolling back" >&2
          ssh "$TARGET" status || true
          ssh "$TARGET" rollback || echo "::error::rollback failed: the server needs a person"
          exit 1
      - name: Record the deployed tag off the server
        # If the server is lost, the last good tag is here (job summary and artifact), not only
        # in /opt/technest/.env. Restore drill: DEPLOY.md 8.4.
        run: |
          {
            echo "environment=${{ inputs.environment }}"
            echo "tag=$TAG"
            echo "commit=${{ github.sha }}"
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deployed-tag.txt
          {
            echo "### Deployed to ${{ inputs.environment }}"
            echo
            echo "Image tag: \`$TAG\` (commit \`${{ github.sha }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployed-tag-${{ inputs.environment }}-${{ github.run_number }}
          path: deployed-tag.txt
          retention-days: 90
      - name: Remove images older than two weeks
        # Only after a healthy deploy, and never the images in use (the previous tag stays
        # for two weeks, so a rollback still has its image). Four images per deploy would
        # otherwise fill the disk.
        run: ssh "$TARGET" prune || echo "::warning::image prune failed"
