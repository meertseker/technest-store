# Tech Nest production stack (Hetzner CX43: 8 vCPU, 16 GB). See DEPLOY.md.
# Images are built by GitHub Actions and pulled from GHCR; nothing is built on the server.
#   docker compose pull && docker compose run --rm migrate && docker compose up -d --remove-orphans
# Secrets live in /opt/technest/.env (chmod 600), never in git. See .env.production.template.
# POSTGRES_PASSWORD goes into DATABASE_URL unencoded: generate it hex-only (openssl rand -hex 32).

name: technest

x-defaults: &defaults
  restart: unless-stopped
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgres://technest:${POSTGRES_PASSWORD:?}@postgres:5432/technest?sslmode=disable
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?}
  COOKIE_SECRET: ${COOKIE_SECRET:?}
  STORE_CORS: https://${SHOP_DOMAIN:-technest.co.uk}
  ADMIN_CORS: https://admin.${SHOP_DOMAIN:-technest.co.uk}
  AUTH_CORS: https://${SHOP_DOMAIN:-technest.co.uk},https://admin.${SHOP_DOMAIN:-technest.co.uk}
  MEDUSA_BACKEND_URL: https://api.${SHOP_DOMAIN:-technest.co.uk}
  S3_FILE_URL: ${S3_FILE_URL:?}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: auto
  PHOTO_WORKER_URL: http://photo-worker:7000
  # birefnet-general is the default (lead's decision); it needs the 6 GB photo-worker limit below.
  # Fallback on a smaller box: PHOTO_MODEL=isnet-general-use (fits 4 GB). See infra/photo-worker/README.md.
  PHOTO_MODEL: ${PHOTO_MODEL:-birefnet-general}
  # Quick Add (E4): Claude vision suggestions, server-side only (never sent to the browser or logged).
  # Empty = Quick Add without AI suggestions. Optional per-admin limit (default 60 analyses/hour).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  QUICK_ADD_AI_LIMIT_PER_HOUR: ${QUICK_ADD_AI_LIMIT_PER_HOUR:-60}
  SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
  # Payments and email (E2)
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # mailserver's network alias, so STARTTLS sees the certificate's own name.
  SMTP_HOST: ${SMTP_HOST:-mail.${SHOP_DOMAIN:-technest.co.uk}}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-orders@${SHOP_DOMAIN:-technest.co.uk}}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  # Must be the SMTP_USER address: the mailserver refuses other senders (SPOOF_PROTECTION).
  MAIL_FROM: ${MAIL_FROM:-Tech Nest <orders@${SHOP_DOMAIN:-technest.co.uk}>}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-hello@technest.co.uk}
  SHOP_NOTIFY_EMAIL: ${SHOP_NOTIFY_EMAIL:-hello@technest.co.uk}
  STOREFRONT_URL: https://${SHOP_DOMAIN:-technest.co.uk}

services:
  caddy:
    <<: *defaults
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:-technest.co.uk}
      ACME_EMAIL: ${ACME_EMAIL:-hello@technest.co.uk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: { condition: service_healthy }
      storefront: { condition: service_started }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

  server:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-backend:${IMAGE_TAG:-main}
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  worker:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-backend:${IMAGE_TAG:-main}
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    # Medusa 2.21 `medusa start` serves GET /health in every worker mode, so the image's
    # HEALTHCHECK applies here too (checked in @medusajs/medusa dist/commands/start.js).
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  # One-shot: docker compose run --rm migrate (deploy.yml runs it before `up -d`).
  migrate:
    image: ghcr.io/${GHCR_OWNER:?}/technest-backend:${IMAGE_TAG:-main}
    profiles: [ops]
    networks: [internal]
    environment:
      <<: *backend-env
    command: ["/app/apps/backend/node_modules/.bin/medusa", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  storefront:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-storefront:${IMAGE_TAG:-main}
    environment:
      # Server-side calls should use the internal network instead of going out through
      # Cloudflare. Needs the storefront to read MEDUSA_BACKEND_URL on the server (asked E3).
      MEDUSA_BACKEND_URL: http://server:9000
      SENTRY_DSN: ${SENTRY_DSN_STOREFRONT:-}
    depends_on:
      server: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "1.5", memory: 1g } } }

  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: technest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: technest
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technest -d technest"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256m
    deploy: { resources: { limits: { memory: 2g } } }

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 512m } } }

  # Background removal. Internal only: no ports, never exposed to the internet.
  photo-worker:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-photo-worker:${IMAGE_TAG:-main}
    environment:
      OMP_NUM_THREADS: "2"
      # Keep in step with PHOTO_MODEL above (the backend always names the model; this is the preload).
      PHOTO_WORKER_DEFAULT_MODEL: ${PHOTO_MODEL:-birefnet-general}
    # 6 GB: birefnet-general was OOM-killed at 4 GB (docs/plans/2026-09-29-e4-photo-pipeline.md).
    # Fallback: set PHOTO_MODEL=isnet-general-use in .env and lower this to 4g if the server is short of RAM.
    deploy: { resources: { limits: { cpus: "2", memory: 6g } } }

  # Nightly pg_dump -> R2 (technest-backups), 30-day retention. See infra/backup and DEPLOY.md.
  #   docker compose run --rm backup backup.sh          take a backup now
  #   docker compose run --rm backup restore.sh --list  list backups
  backup:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-backup:${IMAGE_TAG:-main}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: technest
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: technest
      BACKUP_AT: ${BACKUP_AT:-03:15}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_REMOTE: r2:${BACKUP_BUCKET:-technest-backups}/db
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${S3_ENDPOINT:?}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

  # Outgoing mail for the shop (E2): docker-mailserver = Postfix + Dovecot + OpenDKIM.
  # Setup, DNS (MX/SPF/DKIM/DMARC/PTR) and the port 25 relay fallback: DEPLOY.md section 11.
  # server/worker send through it on the internal network (587 + STARTTLS + auth as orders@).
  # Accounts, DKIM keys and mail live in named volumes; nothing secret is in this file.
  mailserver:
    <<: *defaults
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1
    profiles: [mail]
    hostname: mail.${SHOP_DOMAIN:-technest.co.uk}
    networks:
      internal:
        # The backend connects as mail.<domain> so the TLS certificate name matches
        # (Docker's DNS answers this alias inside the network).
        aliases: ["mail.${SHOP_DOMAIN:-technest.co.uk}"]
    # 25: inbound mail for @domain (MX: replies, bounces, DMARC reports).
    # 993: IMAPS, to read the orders@ mailbox from a mail app.
    # 587 is NOT published: only server/worker submit mail, over the internal network.
    ports: ["25:25", "993:993"]
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
      POSTMASTER_ADDRESS: postmaster@${SHOP_DOMAIN:-technest.co.uk}
      # Certificate: Caddy obtains and renews it for mail.<domain> (Caddyfile site block,
      # DEPLOY.md 11.2); this container reads it read-only from Caddy's data volume.
      SSL_TYPE: manual
      SSL_CERT_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${SHOP_DOMAIN:-technest.co.uk}/mail.${SHOP_DOMAIN:-technest.co.uk}.crt
      SSL_KEY_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${SHOP_DOMAIN:-technest.co.uk}/mail.${SHOP_DOMAIN:-technest.co.uk}.key
      # Senders may only use their own address (the backend logs in as orders@).
      SPOOF_PROTECTION: "1"
      PERMIT_DOCKER: none
      ENABLE_OPENDKIM: "1"
      ENABLE_OPENDMARC: "1"
      ENABLE_POLICYD_SPF: "1"
      ENABLE_IMAP: "1"
      ENABLE_POP3: "0"
      ENABLE_MANAGESIEVE: "0"
      # Low-volume transactional mail: skip the memory-heavy filters.
      ENABLE_AMAVIS: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_RSPAMD: "0"
      ENABLE_FAIL2BAN: "1"
      ENABLE_UPDATE_CHECK: "0"
      # Only when Hetzner keeps port 25 closed (DEPLOY.md 11.7), e.g. [smtp-relay.brevo.com]:587.
      DEFAULT_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      RELAY_USER: ${MAIL_RELAY_USER:-}
      RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      # Accounts (password hashes) and DKIM private keys: back this volume up, never commit it.
      - mail_config:/tmp/docker-mailserver
      - caddy_data:/caddy-data:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add: [NET_ADMIN] # fail2ban bans by IP
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -P 'LISTEN.+:submission' || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
    deploy: { resources: { limits: { memory: 1g } } }

networks:
  internal: {}

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  mail_data: {}
  mail_state: {}
  mail_logs: {}
  mail_config: {}
