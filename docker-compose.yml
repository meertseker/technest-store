# Tech Nest production stack (one Hetzner box; the limits below suit 8 GB). See DEPLOY.md.
# On a 4 GB box add infra/staging/docker-compose.staging.yml (COMPOSE_FILE in .env).
# Background removal (fal.ai) and email (Resend) are hosted services: nothing heavy runs here.
# Images are built by GitHub Actions and pulled from GHCR; nothing is built on the server.
#   docker compose pull && docker compose run --rm migrate && docker compose up -d --remove-orphans
# Secrets live in /opt/technest/.env (chmod 600), never in git. See .env.production.template.
# POSTGRES_PASSWORD goes into DATABASE_URL unencoded: generate it hex-only (openssl rand -hex 32).
# REDIS_PASSWORD goes into REDIS_URL the same way: hex-only too.
# Two networks: `edge` (caddy, storefront, server) and `data` (server, worker, postgres, redis,
# backup, migrate). Only the server is on both, so the storefront can't reach Postgres or Redis.

name: technest

x-defaults: &defaults
  restart: unless-stopped
  networks: [data]
  # journald, not json-file: a container's json-file log is deleted when a deploy recreates
  # the container, and with it every trace of the payments and webhooks before the deploy.
  # Read with `docker compose logs` or `journalctl CONTAINER_TAG=technest-server`; retention
  # is journald's (DEPLOY.md, "Günlükler").
  logging:
    driver: journald
    options: { tag: "technest-{{.Name}}" }

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgres://technest:${POSTGRES_PASSWORD:?}@postgres:5432/technest?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?}
  COOKIE_SECRET: ${COOKIE_SECRET:?}
  STORE_CORS: https://${SHOP_DOMAIN:-technestlondon.co.uk}
  ADMIN_CORS: https://admin.${SHOP_DOMAIN:-technestlondon.co.uk}
  AUTH_CORS: https://${SHOP_DOMAIN:-technestlondon.co.uk},https://admin.${SHOP_DOMAIN:-technestlondon.co.uk}
  MEDUSA_BACKEND_URL: https://api.${SHOP_DOMAIN:-technestlondon.co.uk}
  # Staff links in emails (password reset, new trade application, repair, stock) point here directly.
  ADMIN_URL: https://admin.${SHOP_DOMAIN:-technestlondon.co.uk}/app
  S3_FILE_URL: ${S3_FILE_URL:?}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: auto
  # Photos (E4): background removal runs on fal.ai (hosted BiRefNet), server-side only.
  # Empty = photo processing is switched off; the rest of the shop works.
  FAL_KEY: ${FAL_KEY:-}
  PHOTO_TIMEOUT_MS: ${PHOTO_TIMEOUT_MS:-90000}
  # Quick Add (E4): Claude vision suggestions, server-side only (never sent to the browser or logged).
  # Empty = Quick Add without AI suggestions. Optional per-admin limit (default 60 analyses/hour).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  QUICK_ADD_AI_LIMIT_PER_HOUR: ${QUICK_ADD_AI_LIMIT_PER_HOUR:-60}
  QUICK_ADD_AI_TIMEOUT_MS: ${QUICK_ADD_AI_TIMEOUT_MS:-60000}
  QUICK_ADD_AI_DEADLINE_MS: ${QUICK_ADD_AI_DEADLINE_MS:-90000}
  # Repair booking form (E1): Cloudflare Turnstile secret. Empty = every booking is refused in production.
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
  # Dead-man's switch for the worker (docs/ops/uptime-and-sentry.md). Empty = no heartbeat.
  WORKER_HEARTBEAT_URL: ${WORKER_HEARTBEAT_URL:-}
  # Payments and email (E2)
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Resend signs bounce/complaint webhooks with this (DEPLOY.md 11.2). Empty = the hook answers 503.
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  # Email goes out through Resend over SMTP (587 + STARTTLS). SMTP_PASS is the Resend API key;
  # the user name is literally "resend". Any SMTP provider works: override the four values in .env.
  SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-resend}
  SMTP_PASS: ${SMTP_PASS:?}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  # The address's domain must be verified in Resend (DEPLOY.md section 11).
  MAIL_FROM: ${MAIL_FROM:-Tech Nest <orders@${SHOP_DOMAIN:-technestlondon.co.uk}>}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-hello@technestlondon.co.uk}
  SHOP_NOTIFY_EMAIL: ${SHOP_NOTIFY_EMAIL:-hello@technestlondon.co.uk}
  STOREFRONT_URL: https://${SHOP_DOMAIN:-technestlondon.co.uk}
  # Stored email attempts (and the addresses in them) are deleted after this many days.
  NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}

services:
  caddy:
    <<: *defaults
    # Base images are pinned by digest (the tag says which release): a re-pushed tag can't change
    # what a deploy runs. Bump tag and digest together (docker buildx imagetools inspect <tag>).
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    networks: [edge]
    # TCP only: Cloudflare proxies to the origin over TCP, so HTTP/3 (UDP 443) is never used here.
    ports: ["80:80", "443:443"]
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:-technestlondon.co.uk}
      ACME_EMAIL: ${ACME_EMAIL:-hello@technestlondon.co.uk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: { condition: service_healthy }
      storefront: { condition: service_started }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

  server:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-backend:${IMAGE_TAG:-main}
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      # Node's heap stops at about 70 % of the memory limit, so V8 collects garbage before the
      # kernel kills the container; the rest is for buffers and native memory. Change both together.
      NODE_OPTIONS: --max-old-space-size=1400
    networks: [edge, data]
    # Medusa finishes the requests in flight on SIGTERM; Docker's default 10 s would cut a
    # checkout or a capture in the middle of a deploy.
    stop_grace_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  worker:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-backend:${IMAGE_TAG:-main}
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      NODE_OPTIONS: --max-old-space-size=1400
    # Medusa 2.21 `medusa start` serves GET /health in every worker mode, so the image's
    # HEALTHCHECK applies here too (checked in @medusajs/medusa dist/commands/start.js).
    # Lets the job in hand (a capture, an email) finish before the container is replaced.
    stop_grace_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  # One-shot: docker compose run --rm migrate (deploy.yml runs it before `up -d`).
  migrate:
    image: ghcr.io/${GHCR_OWNER:?}/technest-backend:${IMAGE_TAG:-main}
    profiles: [ops]
    networks: [data]
    environment:
      <<: *backend-env
    # --all-or-nothing: a failed migration reverts the ones this run applied.
    # --execute-safe-*: never stop at a prompt (there is no terminal); unsafe link or
    # index changes are left for a person to run by hand.
    command:
      - /app/apps/backend/node_modules/.bin/medusa
      - db:migrate
      - --all-or-nothing
      - --execute-safe-links
      - --execute-safe-search
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  storefront:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-storefront:${IMAGE_TAG:-main}
    networks: [edge]
    environment:
      # Server-side calls should use the edge network instead of going out through
      # Cloudflare. Needs the storefront to read MEDUSA_BACKEND_URL on the server (asked E3).
      MEDUSA_BACKEND_URL: http://server:9000
      SENTRY_DSN: ${SENTRY_DSN_STOREFRONT:-}
      NODE_OPTIONS: --max-old-space-size=700
    depends_on:
      server: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "1.5", memory: 1g } } }

  postgres:
    <<: *defaults
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: technest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: technest
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technest -d technest"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256m
    deploy: { resources: { limits: { memory: 2g } } }

  redis:
    <<: *defaults
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # A password even on the private network: anything that gets a foothold on it can't
    # read or rewrite the job queues and locks. The health check reads it from REDISCLI_AUTH.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 512m } } }

  # Hourly pg_dump -> R2 (technest-backups), 30-day retention. See infra/backup and DEPLOY.md.
  # The interval is the most a lost disk can cost: up to one hour of orders.
  #   docker compose run --rm backup backup.sh          take a backup now
  #   docker compose run --rm backup restore.sh --list  list backups
  backup:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:?}/technest-backup:${IMAGE_TAG:-main}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: technest
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: technest
      BACKUP_EVERY_MINUTES: ${BACKUP_EVERY_MINUTES:-60}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Dead-man's switch (e.g. healthchecks.io): pinged after every good backup, so silence
      # or a /fail ping raises the alarm. Empty = nobody is told when backups stop.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # age public key: dumps are encrypted before upload; the private key stays off this server.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_REMOTE: r2:${BACKUP_BUCKET:-technest-backups}/db
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${S3_ENDPOINT:?}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes: [backup_state:/var/lib/backup]
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }

networks:
  edge: {}
  data: {}

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  backup_state: {}
